{# 2026-09-25: Radios inside the labels – the browser marks the choice on click, then autosave stores it. #}
<div class="sak-owner" role="radiogroup" aria-label="Tiltakseier">
	{% for value, label in tiltakseier_valg %}
	<label class="sak-owner-btn{% if valgt == value %} is-selected{% endif %}">
		<input class="sak-owner-input" type="radio" name="tiltakseier-{{ row_id }}" value="{{ value }}"{% if valgt == value %} checked{% endif %}>
		{{ label }}
	</label>
	{% empty %}
	<label class="sak-owner-btn{% if valgt == 'driftsleverandor' %} is-selected{% endif %}">
		<input class="sak-owner-input" type="radio" name="tiltakseier-{{ row_id }}" value="driftsleverandor"{% if valgt == 'driftsleverandor' %} checked{% endif %}>
		Driftsleverandør
	</label>
	<label class="sak-owner-btn{% if valgt == 'digitaliseringsetaten' %} is-selected{% endif %}">
		<input class="sak-owner-input" type="radio" name="tiltakseier-{{ row_id }}" value="digitaliseringsetaten"{% if valgt == 'digitaliseringsetaten' %} checked{% endif %}>
		Digitaliseringsetaten
	</label>
	<label class="sak-owner-btn{% if valgt == 'systemeier' %} is-selected{% endif %}">
		<input class="sak-owner-input" type="radio" name="tiltakseier-{{ row_id }}" value="systemeier"{% if valgt == 'systemeier' %} checked{% endif %}>
		Systemeier
	</label>
	{% endfor %}
</div>
